name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

  connected-tests:
    name: Keyboard screenshot test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run instrumented screenshot test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            mkdir -p app/build/outputs/keyboard-screenshots
            adb pull /sdcard/Android/data/app.typelauncher/files/Pictures/screenshots/full_screen_keyboard_open.png app/build/outputs/keyboard-screenshots/full_screen_keyboard_open.png

      - name: Upload keyboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-screenshot
          path: app/build/outputs/keyboard-screenshots/
