name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

  screenshots:
    name: Screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Record mode: generates fresh goldens on every run.
      # Once golden images are committed to src/test/snapshots/images/, change to
      # verify mode by dropping -Proborazzi.test.record and letting the default compare.
      - name: Record Roborazzi screenshots
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.MainActivityRobolectricScreenshotTest" -Proborazzi.test.record=true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/src/test/snapshots/images/
