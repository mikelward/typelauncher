name: Android CI

on:
  pull_request:
    # Skip CI for pushes whose every changed path is housekeeping that
    # has no effect on the app build:
    #   - documentation (CLAUDE.md, SPEC.md, docs/*), with PRIVACY.md
    #     negated back in because it backs the hosted privacy policy
    #     linked from the About dialog — a PRIVACY.md-only push still
    #     needs to build and (on main) ship a Play release;
    #   - any dotfile at the repo root (`.gitignore`, `.editorconfig`,
    #     `.gitattributes`, …) or anything under any dotdir at the repo
    #     root (`.claude/`, `.idea/`, `.vscode/`, `.cursor/`,
    #     `.github/ISSUE_TEMPLATE/`, `.github/dependabot.yml`, …), with
    #     `.github/workflows/**` negated back in so workflow edits
    #     re-trigger CI and validate themselves.
    # GitHub Actions evaluates paths-ignore with `dot: true` and honors
    # `!` negation when it follows a positive pattern, applied in order.
    paths-ignore:
      - '**/*.md'
      - '!PRIVACY.md'
      - '.*'
      - '.*/**'
      - '!.github/workflows/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '!PRIVACY.md'
      - '.*'
      - '.*/**'
      - '!.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Materialize debug keystore
        # Decode the checked-in-only-as-a-secret debug keystore so CI-built APKs
        # share a signing identity with previous CI builds. Without this, every
        # runner generates its own ~/.android/debug.keystore and tester devices
        # refuse to install successive Firebase App Distribution releases as
        # updates. Skipped on PRs / forks where the secret isn't set; the build
        # still finishes using AGP's auto-generated debug keystore.
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=${RUNNER_TEMP}/debug.keystore" >> "${GITHUB_ENV}"

      - name: Materialize google-services.json
        # Drops the Firebase project config into app/google-services.json so the
        # google-services + crashlytics gradle plugins activate (see
        # app/build.gradle.kts) and Crashlytics + Performance Monitoring ship
        # in the built APK. Skipped on forks / PRs without the secret — the
        # build still finishes, just without telemetry.
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Print failing test details
        # When `gradlew test` fails the JUnit XML still contains the failure
        # messages and stack traces. Dump them to the job log AND, on a PR
        # build, post them as a PR comment so the same data is reachable
        # without needing to sign in to view the job log or unzip the
        # artifact.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: ${{ github.job }}
        run: |
          shopt -s nullglob globstar
          summary=""
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
              summary+=$'\n\n'"### \`$xml\`"$'\n```xml\n'"$(cat "$xml")"$'\n```'
            fi
          done
          if [ -n "$PR_NUMBER" ] && [ -n "$summary" ]; then
            body=$'<!-- ci-failure -->'$'\n'"**${JOB_NAME} failed.** Failing test reports:"$'\n'"$summary"
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d "$(jq -n --arg body "$body" '{body:$body}')" > /dev/null
          fi

      - name: Upload unit test reports
        # Always upload so a failed test run leaves the JUnit XMLs and HTML
        # reports for inspection. Without this, diagnosing a CI-only test
        # failure means re-running locally — and "fix it blindly" loops
        # waste an iteration each time.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: ./gradlew lint

      - name: Build release notes
        # Walks every commit in this push oldest-first and collects the
        # subject line of each one worth shipping as a release note — to
        # both Firebase App Distribution (testers' phones) and the Play
        # Store internal track (Play Console "What's new"):
        #   - skip `ci:`-prefixed housekeeping commits (e.g. snapshot
        #     regenerations) — they describe CI plumbing, not user-visible
        #     changes;
        #   - skip commits whose every changed path is repo housekeeping —
        #     a `.md` file (CLAUDE.md / SPEC.md / docs/*) or any dotfile /
        #     dotdir at the repo root (`.github/` workflows + templates +
        #     dependabot config, `.claude/` Claude Code workspace state,
        #     `.gitignore`, `.editorconfig`, etc.). `PRIVACY.md` is the
        #     explicit exception: it backs the hosted privacy policy
        #     linked from the About dialog, so a change there is
        #     genuinely user-facing and counts as a real commit.
        # The qualifying subjects are emitted as a "• "-bulleted list,
        # oldest-first — always bulleted, even when there's only one
        # qualifying commit, so the Play "What's new" card and Firebase
        # release notes render with a consistent shape. If no commit in
        # the push qualifies, sets RELEASE_NOTES_SKIP=true and both the
        # Firebase distribution and Play upload steps below skip — so a
        # push of only ci: / docs / dotfile commits doesn't buzz
        # testers' phones or ship a redundant Play release.
        # Engineering detail lives in the commit body, which neither
        # surface shows — see the "Commit messages" section in CLAUDE.md
        # for the wording convention. Play caps each locale at 500
        # characters; the truncation budget here is measured against the
        # summed character count of the subject strings alone, ignoring
        # the bullet/newline formatting overhead. If the budget
        # overflows we drop trailing subjects (oldest-first preserved at
        # the head) until it fits and append "\n…" so the user knows the
        # tail was cut. If a single subject alone exceeds the cap
        # (unlikely — subjects are conventionally ≤ ~70 chars) we
        # hard-truncate to 499 chars and append "…".
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # On a first push to a branch (or after a force-reset that
          # orphans the old tip) BEFORE_SHA is all-zeros or otherwise
          # unreachable. There's no usable range to walk in that case, so
          # fall back to just HEAD — walking the entire history reachable
          # from HEAD would be both slow and meaningless.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --quiet --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            shas=$(git log -1 --format=%H "$AFTER_SHA")
          else
            shas=$(git log --reverse --no-merges --format=%H "$BEFORE_SHA..$AFTER_SHA")
          fi

          subjects=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            s=$(git log -1 --format=%s "$sha")
            case "$s" in
              ci:*) continue ;;
            esac
            relevant=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # `case` patterns match `*` against `/` too, so `.*` skips
              # any path whose first component starts with `.` — covers
              # `.github/`, `.claude/`, `.gitignore`, `.editorconfig` etc.
              # in one pattern.
              case "$f" in
                PRIVACY.md) relevant=true; break ;;
                .*)         ;;
                *.md)       ;;
                *)          relevant=true; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$sha")
            if [ "$relevant" = "false" ]; then
              continue
            fi
            subjects+=("$s")
          done <<< "$shas"

          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "No release-worthy commits in this push (all ci: / docs / dotfile housekeeping); skipping Firebase distribution and Play upload."
            echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          MAX=500
          TRUNC_MARK=$'\n…'

          # `wc -m` counts characters under a UTF-8 locale; pin it so
          # the bullet ("• ", 1 visible char) and the ellipsis ("…", 1
          # char) are scored as Play sees them, not as raw bytes.
          export LC_ALL=C.UTF-8

          # Always emit a "• "-bulleted line per subject — even for a
          # single qualifying commit — so the Play "What's new" card
          # and Firebase release notes always render as a list.
          format_notes() {
            local first=1
            for s in "$@"; do
              if [ "$first" -eq 1 ]; then
                printf '%s' "• $s"
                first=0
              else
                printf '\n• %s' "$s"
              fi
            done
          }

          char_len() {
            printf '%s' "$1" | wc -m
          }

          # Truncate by summed subject-content length only — the bullet
          # and newline overhead per line is ignored when measuring
          # against MAX. Reserves 1 char of headroom so a trailing "…"
          # marker stays inside the cap.
          subjects_chars() {
            local total=0
            for s in "$@"; do
              total=$(( total + $(char_len "$s") ))
            done
            printf '%s' "$total"
          }

          kept=("${subjects[@]}")
          truncated=false
          while [ "${#kept[@]}" -gt 0 ] \
            && [ "$(subjects_chars "${kept[@]}")" -gt $((MAX - 1)) ]; do
            unset 'kept[${#kept[@]}-1]'
            truncated=true
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            # First subject alone exceeds the cap; hard-truncate the
            # bullet line to 499 chars and append "…".
            notes=$(printf '%s' "• ${subjects[0]}" | cut -c 1-499)
            notes="${notes}…"
          else
            notes=$(format_notes "${kept[@]}")
            if [ "$truncated" = true ]; then
              notes="${notes}${TRUNC_MARK}"
            fi
          fi

          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            printf '%s\n' "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Distribute via Firebase App Distribution
        # On push to main only — feature-branch CI runs would otherwise spam
        # testers with WIP builds. Skipped when secrets aren't set so the build
        # still finishes on a fresh repo / fork. Also skipped when the
        # preceding step set RELEASE_NOTES_SKIP=true because every commit in
        # this push was either `ci:`-prefixed or pure docs / dotfile
        # housekeeping (`.github/`, `.claude/`, …) — see "Select release
        # notes subject" — so we don't buzz testers' phones for a
        # notification whose preview would read e.g. "ci: bump
        # actions/checkout". Runs before the Play Store upload so a Play
        # failure (e.g. quota, propagation) doesn't gate the faster Firebase
        # channel testers actually rely on.
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.FIREBASE_APP_ID != '' &&
          env.FIREBASE_SERVICE_ACCOUNT_JSON != '' &&
          env.RELEASE_NOTES_SKIP != 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Tester group must exist in Firebase App Distribution console — see
          # docs/firebase-app-distribution.md. "testers" is the convention; rename
          # there + here together if you change it.
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          # Push notification on the tester's phone shows the first ~60 chars
          # of these notes — for a multi-commit push that's the oldest
          # qualifying commit's subject (the list is oldest-first; see
          # "Build release notes" upstream). The full bulleted list is
          # visible inside the Firebase tester app, and the same string
          # is what Play ships as "What's new", so the two surfaces stay
          # in sync.
          releaseNotes: |
            ${{ env.RELEASE_NOTES }}
            ---
            Build: ${{ github.run_number }} · ${{ github.sha }}

      - name: Materialize release keystore
        # Decoded whenever the keystore secret is present, independent of the
        # Play upload secrets. This lets the user populate the keystore secrets
        # first and download the resulting signed AAB from CI artifacts to do
        # the manual seed upload Play Console requires for new listings, then
        # add PLAY_SERVICE_ACCOUNT_JSON later to enable the automated upload.
        # See docs/play-store-internal-track.md.
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Build release AAB
        # Gated only on the keystore being present — a signed AAB is useful on
        # its own (downloadable artifact for the seed upload, even before the
        # Play service account is set up). Release signing config only attaches
        # when RELEASE_KEYSTORE_FILE is set (see app/build.gradle.kts), so
        # without the keystore Play would reject the AAB anyway.
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RELEASE_KEYSTORE_FILE != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Upload signed AAB as workflow artifact
        # Lets us download the signed AAB from the Actions UI for the one-time
        # manual seed upload to Play Console. Useful indefinitely afterwards
        # too if a release ever needs to be inspected or re-uploaded by hand.
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RELEASE_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Compose Play Store release notes
        # The upload-google-play action takes a directory of whatsnew-<locale>
        # files. The bulleted list of commit subjects was already built
        # upstream by "Build release notes" (and truncated to Play's
        # 500-byte per-locale cap); this step just writes it to disk in
        # the layout the action expects. When that earlier step set
        # RELEASE_NOTES_SKIP=true (every commit in the push was ci: /
        # docs / dotfile housekeeping) the gate below skips this and the
        # upload step.
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.PLAY_SERVICE_ACCOUNT_JSON != '' &&
          env.RELEASE_NOTES_SKIP != 'true'
        env:
          # PLAY_SERVICE_ACCOUNT_JSON has to be redeclared here because GitHub
          # Actions step-level env doesn't propagate to neighbouring steps' if
          # expressions — without this the gate above would always evaluate to
          # empty and the step would silently skip.
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/whatsnew"
          printf '%s' "${RELEASE_NOTES}" \
            > "${RUNNER_TEMP}/whatsnew/whatsnew-en-US"
          echo "PLAY_WHATSNEW_DIR=${RUNNER_TEMP}/whatsnew" >> "${GITHUB_ENV}"

      - name: Upload to Play Store internal track
        # Gated so it only runs on push to main with both the upload key and
        # service account configured. Also skipped when "Build release
        # notes" set RELEASE_NOTES_SKIP=true because every commit in this
        # push was either `ci:`-prefixed or pure docs / dotfile housekeeping
        # (`.github/`, `.claude/`, …) — no Play-worthy "What's new" entry
        # exists, so shipping a release would be redundant. See
        # docs/play-store-internal-track.md for the Play Console /
        # service-account setup the upload depends on.
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.PLAY_SERVICE_ACCOUNT_JSON != '' &&
          env.RELEASE_NOTES_SKIP != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.typelauncher
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ env.PLAY_WHATSNEW_DIR }}

  connected-tests:
    name: Keyboard screenshot unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Robolectric keyboard screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.MainActivityRobolectricScreenshotTest" -Proborazzi.test.record=true

      - name: Run launcher icon snapshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.LauncherIconScreenshotTest" -Proborazzi.test.record=true

      - name: Run app-icon disambiguator screenshot tests
        # Renders the regional-disambiguator badge ("US"/"UK"/"INTL") on
        # representative app icons so the PR `roborazzi-screenshots`
        # artifact captures visual changes to the badge.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.AppIconDisambiguatorScreenshotTest" -Proborazzi.test.record=true

      - name: Run edit-app dialog screenshot tests
        # Renders EditAppDialogContent in the no-override and
        # with-override states so the PR `roborazzi-screenshots`
        # artifact captures visual changes to the rename dialog.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.EditAppDialogScreenshotTest" -Proborazzi.test.record=true

      - name: Print failing test details
        if: failure()
        run: |
          shopt -s nullglob globstar
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
            fi
          done

      - name: Upload Roborazzi screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/src/test/snapshots/images/

      - name: Upload screenshot test reports
        # JUnit XMLs and HTML reports for the screenshot suite — uploaded
        # even on failure so a CI-only crash leaves diagnostic output
        # behind. Pairs with the same step in the build job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1
