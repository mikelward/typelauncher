name: Android CI

on:
  pull_request:
    # Skip CI for pushes whose every changed path is housekeeping that
    # has no effect on the app build:
    #   - documentation (CLAUDE.md, SPEC.md, docs/*), with PRIVACY.md
    #     negated back in because it backs the hosted privacy policy
    #     linked from the About dialog — a PRIVACY.md-only push still
    #     needs to build and (on main) ship a Play release;
    #   - any dotfile at the repo root (`.gitignore`, `.editorconfig`,
    #     `.gitattributes`, …) or anything under any dotdir at the repo
    #     root (`.claude/`, `.idea/`, `.vscode/`, `.cursor/`,
    #     `.github/ISSUE_TEMPLATE/`, `.github/dependabot.yml`, …), with
    #     `.github/workflows/**` re-included so workflow edits
    #     re-trigger CI and validate themselves.
    # This uses `paths` (an allow-list), NOT `paths-ignore`: `!` negation
    # only re-includes files under `paths`. Under `paths-ignore` every
    # entry is a pure exclusion and the `!` re-includes are silently
    # ignored, so a PRIVACY.md-only or workflow-only change was being
    # skipped exactly where the comment above says it must run. Patterns
    # are applied in order and the last match wins per file: match
    # everything, exclude docs + root dotfiles/dotdirs, then re-include
    # PRIVACY.md and the workflows. A push runs when at least one changed
    # file survives as included; a housekeeping-only push matches nothing
    # and is skipped.
    paths:
      - '**'
      - '!**/*.md'
      - '!.*'
      - '!.*/**'
      - 'PRIVACY.md'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      - '!.*'
      - '!.*/**'
      - 'PRIVACY.md'
      - '.github/workflows/**'
  # Manual override for the `deploy` job: lets a maintainer force an
  # internal-track release from the GitHub web UI (works from a phone
  # browser — no local build tooling needed) when `main`'s tip is stuck
  # behind the "no release-worthy commits" skip (see "Build release
  # notes" in the `deploy` job) but a tester needs the current tip on
  # their device anyway — e.g. to read diagnostic logging that hasn't
  # shipped because every commit since the last release was `internal:`
  # (or `ci:` / `docs:` / `refactor:` / `test:` / `tests:`) prefixed.
  # No inputs: dispatching always targets the selected ref (main by
  # default in the UI) and the `deploy` job's `if:` below re-checks that.
  workflow_dispatch:

# No workflow-level permissions — each job declares the least-privilege
# scope it needs. Workflow-level `pull-requests: write` would also leak
# into the screenshot job and the deploy job, neither of which posts
# back to the PR.

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default, so a unit test
    # that deadlocks (a latch that never releases, an await with no timeout)
    # burns hours before the runner is reclaimed instead of failing fast. The
    # full build + test + lint finishes well under this cap; the screenshot
    # job below already sets the same limit.
    timeout-minutes: 30
    env:
      # Secret *presence* flags, evaluated at job level. A step's `if:`
      # cannot read a variable defined in that same step's `env:` block, so
      # a gate like `if: env.GOOGLE_SERVICES_JSON != ''` that declared the
      # secret in the same step always saw an empty string and skipped even
      # when the secret was configured. Job-level env IS visible to a step's
      # `if:`, and exposing only a boolean keeps the secret value scoped to
      # the step that actually uses it instead of widening it to every step.
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    permissions:
      contents: read
      # Used by "Print failing test details" to post a comment on the
      # originating PR when `./gradlew test` fails. The comments API
      # path (/repos/{r}/issues/{n}/comments) is satisfied by
      # `pull-requests: write` when the target is a PR — no separate
      # `issues: write` needed.
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # PRs run in `pull_request` (not `pull_request_target`), so a
          # malicious commit can't write to main's cache directly — but
          # it CAN poison its own branch's cache, which a follow-up run
          # on that branch (or a rebase / force-push retry by the
          # reviewer) will silently consume. Lock PRs to read-only;
          # only main pushes write the shared cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Materialize debug keystore
        # Decode the checked-in-only-as-a-secret debug keystore so CI-built APKs
        # share a signing identity with previous CI builds. Without this, every
        # runner generates its own ~/.android/debug.keystore and tester devices
        # refuse to install successive Firebase App Distribution releases as
        # updates. Skipped on PRs / forks where the secret isn't set; the build
        # still finishes using AGP's auto-generated debug keystore.
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=${RUNNER_TEMP}/debug.keystore" >> "${GITHUB_ENV}"

      - name: Materialize google-services.json
        # Drops the Firebase project config into app/google-services.json so the
        # google-services + crashlytics gradle plugins activate (see
        # app/build.gradle.kts) and Crashlytics + Performance Monitoring ship
        # in the built APK. Skipped on forks / PRs without the secret — the
        # build still finishes, just without telemetry.
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Print failing test details
        # When `gradlew test` fails the JUnit XML still contains the failure
        # messages and stack traces. Dump them to the job log AND, on a PR
        # build, post them as a PR comment so the same data is reachable
        # without needing to sign in to view the job log or unzip the
        # artifact.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: ${{ github.job }}
        run: |
          shopt -s nullglob globstar
          summary=""
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
              summary+=$'\n\n'"### \`$xml\`"$'\n```xml\n'"$(cat "$xml")"$'\n```'
            fi
          done
          if [ -n "$PR_NUMBER" ] && [ -n "$summary" ]; then
            body=$'<!-- ci-failure -->'$'\n'"**${JOB_NAME} failed.** Failing test reports:"$'\n'"$summary"
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d "$(jq -n --arg body "$body" '{body:$body}')" > /dev/null
          fi

      - name: Upload unit test reports
        # Always upload so a failed test run leaves the JUnit XMLs and HTML
        # reports for inspection. Without this, diagnosing a CI-only test
        # failure means re-running locally — and "fix it blindly" loops
        # waste an iteration each time.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: ./gradlew lint

  connected-tests:
    name: Keyboard screenshot unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Write so "Commit refreshed screenshots" below can push regenerated
      # snapshot PNGs back to a same-repo PR branch, and so "Post screenshot
      # diffs" can upsert its PR comment. Every other step only reads the
      # checkout.
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          # Same-repo PRs check out the head *branch* (not the read-only
          # refs/pull/N/merge ref) so "Commit refreshed screenshots" below can
          # push to it. Fork PRs and main pushes keep the default checkout —
          # the empty string means "whatever the event would check out anyway".
          # Merge-interaction breakage is still caught on the merge ref: the
          # build job's `gradlew test` runs these same *ScreenshotTest classes'
          # assertions there (capture is gated on -Proborazzi.test.record, the
          # tests themselves are ordinary unit tests). Only the *recording*
          # moves to the head — deliberately, since a merge-ref recording
          # would bake main's unmerged UI into PNGs committed to this branch.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          # Don't leave the (write-scoped, see the job's `permissions`) token
          # in .git/config while the Gradle suites run PR-controlled build and
          # test code — a compromised plugin or dependency could read it from
          # disk and push as the workflow. The one step that needs to push
          # ("Commit refreshed screenshots") receives the token via its own
          # env instead, after every suite has already passed.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Clear committed snapshots before recording
        # Recording only overwrites files the suites still produce: a PNG
        # whose test was removed or renamed would survive checkout untouched,
        # read as "in sync" to the drift check in "Commit refreshed
        # screenshots", and stay committed (and re-published in the artifact)
        # forever. Start from an empty directory so the refresh commit also
        # stages deletions for anything no longer recorded. Side effect, by
        # design: a screenshot class missing from the --tests allow-list
        # below records nothing, so its committed PNGs show up as deletions
        # in the refresh commit — a loud PR diff instead of the silent
        # staleness CLAUDE.md's testing expectations warn about.
        run: |
          rm -rf app/src/test/snapshots/images
          mkdir -p app/src/test/snapshots/images

      - name: Run Robolectric keyboard screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.MainActivityRobolectricScreenshotTest" -Proborazzi.test.record=true

      - name: Run launcher icon snapshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.LauncherIconScreenshotTest" -Proborazzi.test.record=true

      - name: Run app-icon disambiguator screenshot tests
        # Renders the regional-disambiguator badge ("US"/"UK"/"INTL") on
        # representative app icons so the PR `roborazzi-screenshots`
        # artifact captures visual changes to the badge.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.AppIconDisambiguatorScreenshotTest" -Proborazzi.test.record=true

      - name: Run edit-app dialog screenshot tests
        # Renders EditAppDialogContent in the no-override and
        # with-override states so the PR `roborazzi-screenshots`
        # artifact captures visual changes to the rename dialog.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.EditAppDialogScreenshotTest" -Proborazzi.test.record=true

      - name: Run badge picker dialog screenshot tests
        # Renders BadgePickerDialogContent so the PR `roborazzi-screenshots`
        # artifact captures visual changes to the badge tiles (e.g. their
        # corner radius).
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.BadgePickerDialogScreenshotTest" -Proborazzi.test.record=true

      - name: Run search suggestion screenshot tests
        # Renders SearchSuggestionOverlay so the PR `roborazzi-screenshots`
        # artifact captures the inline in-field autocomplete suggestion's styling
        # (bolded prefix, faint package-only match, end-ellipsis truncation).
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.SearchSuggestionScreenshotTest" -Proborazzi.test.record=true

      - name: Run icon normalization screenshot tests
        # Renders the normalized full-bleed app-icon tiles (adaptive, colored
        # shape with padding, sparse logo, plain colored) so the PR
        # `roborazzi-screenshots` artifact captures the tile treatment.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.IconNormalizationScreenshotTest" -Proborazzi.test.record=true

      - name: Run icon shape screenshot tests
        # Renders the selectable icon shapes (system / circle / squircle) so the
        # PR `roborazzi-screenshots` artifact captures the shape options.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.IconShapeScreenshotTest" -Proborazzi.test.record=true

      - name: Run work-badge screenshot tests
        # Renders a work-profile app icon so the PR `roborazzi-screenshots`
        # artifact shows the system briefcase badge riding outside the
        # circular icon clip instead of being sliced off at the corner.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.AppIconWorkBadgeScreenshotTest" -Proborazzi.test.record=true

      - name: Run icon-only grid order screenshot tests
        # Renders the icon-only app grid in forward and reversed sort so the
        # PR `roborazzi-screenshots` artifact shows the highest-rank tile in
        # the bottom-left (reversed) / top-left (forward) corner, matching the
        # dock's bottom-left icon when the dock is hidden.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.IconOnlyGridOrderScreenshotTest" -Proborazzi.test.record=true

      - name: Run name-below grid screenshot tests
        # Renders the "Name below" app-list layout (icon grid with each app's
        # name centered beneath its icon) so the PR `roborazzi-screenshots`
        # artifact shows the labeled tiles, including a long name truncating to
        # two lines.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.NameBelowGridScreenshotTest" -Proborazzi.test.record=true

      - name: Run card opacity screenshot tests
        # Renders SectionCard at a few "Card opacity" levels over a bright
        # gradient so the PR `roborazzi-screenshots` artifact shows the fill
        # fading while the card text stays fully opaque.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.CardOpacityScreenshotTest" -Proborazzi.test.record=true

      - name: Run dock folder screenshot tests
        # Renders the dock folder mini-icon (2x2 corners) and the open folder
        # grid so the PR `roborazzi-screenshots` artifact shows the folder UI.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.DockFolderScreenshotTest" -Proborazzi.test.record=true

      - name: Run dock folder in-place screenshot tests
        # Renders the open folder occupying the dock's footprint — the
        # fewer-than-slots (fits, no reflow) and more-than-slots (scrolls) cases.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.DockFolderInPlaceScreenshotTest" -Proborazzi.test.record=true

      - name: Run app list pick-up screenshot tests
        # Renders an app being dragged out of the list: its tile hides its icon
        # (picked up into the floating drag overlay) while keeping its layout
        # slot, so the PR `roborazzi-screenshots` artifact shows the empty gap.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.AppListPickUpScreenshotTest" -Proborazzi.test.record=true

      - name: Run search dock reveal screenshot tests
        # Renders the search-time dock reveal mid-drag: query active, a list
        # app picked up, and the dock floated in at the bottom as the drop
        # target while the list above holds its geometry.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.SearchDockRevealScreenshotTest" -Proborazzi.test.record=true

      - name: Run content search sections screenshot tests
        # Renders the typed-search contacts / calendar-events sections appended
        # below the app results (and above them under a reversed sort) so the
        # PR `roborazzi-screenshots` artifact shows the divider, monogram
        # contact rows, and time+title event rows.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.ContentSearchScreenshotTest" -Proborazzi.test.record=true

      - name: Run contact quick-actions sheet screenshot tests
        # Renders the compact contact quick-actions sheet — the channel list
        # (Phone, Message, installed-app actions, Email, Open contact) and the
        # number picker after drilling into a multi-number channel — so the PR
        # `roborazzi-screenshots` artifact shows both steps.
        run: ./gradlew :app:testDebugUnitTest --tests "app.typelauncher.ContactActionsSheetScreenshotTest" -Proborazzi.test.record=true

      - name: Print failing test details
        if: failure()
        run: |
          shopt -s nullglob globstar
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
            fi
          done

      - name: Commit refreshed screenshots
        # The record steps above overwrite app/src/test/snapshots/images/ with
        # what this runner actually renders. Historically those regenerations
        # only ever left the runner inside the artifact, so the *committed*
        # snapshots silently drifted from CI's rendering (22 files deep at one
        # point) and every review diff against them was misleading. This step
        # commits any drift back to the PR branch (subject prefixed `ci:`, so
        # release notes skip it) — the committed set now always matches the
        # last green recording.
        #
        # Scope and safety:
        #   - Same-repo PRs only: fork branches aren't pushable with the
        #     workflow token, and pushing to main directly from CI is not this
        #     step's job — PRs that keep their snapshots current mean main
        #     never drifts.
        #   - Runs only when every screenshot suite above passed (a failing
        #     suite fails the job before this step), so a broken run can't
        #     commit bogus images.
        #   - No recursion: pushes made with the workflow's GITHUB_TOKEN do
        #     not trigger new workflow runs at all (GitHub's documented
        #     recursion prevention — not the fork-contributor approval flow),
        #     and the marker-subject check below is belt-and-braces for
        #     setups that swap in a PAT. Corollary: the refreshed head
        #     carries no fresh check runs. That is an accepted trade — the
        #     commit only contains PNGs produced by the suites that just
        #     passed on the same tree, and this repo does not gate merges on
        #     required status checks. A PAT would re-trigger CI but also
        #     re-open the flaky-snapshot commit loop the no-retrigger
        #     property closes for free.
        #   - A concurrent human push between checkout and here makes the
        #     push fail; that's surfaced as a warning, not a red job — the
        #     next run of this workflow re-records and retries.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Scoped to this step only (checkout runs with
          # persist-credentials: false), so the write token never sits on
          # disk while Gradle executes PR-controlled build/test code.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git log -1 --pretty=%s)" = "ci: refresh recorded screenshots" ]; then
            echo "Head commit is already a screenshot refresh; skipping."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- app/src/test/snapshots/images)" ]; then
            echo "Recorded screenshots match the committed ones; nothing to do."
            exit 0
          fi
          git status --porcelain -- app/src/test/snapshots/images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots/images
          git commit -m "ci: refresh recorded screenshots"
          push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push "$push_url" "HEAD:${GITHUB_HEAD_REF}"; then
            # The branch can vanish mid-run: the PR merged (or closed) while
            # this job was still recording and GitHub auto-deleted the head
            # ref, so there is nowhere left to sync the drift to. That is not
            # broken automation — the tree the drift was recorded against is
            # already merged or moot — so it downgrades to a warning like the
            # lost race below. Only that specific case is benign: ls-remote
            # --exit-code exits 2 exactly when the remote answered and the
            # ref does not exist, while auth/transport failures exit
            # differently and must still fail the job, or drift would hide
            # under a green check. (The step runs under bash -e, so the
            # probe's exit code is captured with the guard toggled off.)
            set +e
            remote_ref=$(git ls-remote --exit-code "$push_url" "refs/heads/${GITHUB_HEAD_REF}")
            ref_status=$?
            set -e
            if [ "$ref_status" -eq 2 ]; then
              echo "::warning::Branch ${GITHUB_HEAD_REF} no longer exists (PR merged or closed while this job ran); skipping the screenshot refresh push."
              exit 0
            fi
            if [ "$ref_status" -ne 0 ]; then
              echo "::error::Could not query refs/heads/${GITHUB_HEAD_REF} on the remote (ls-remote exit ${ref_status}); the snapshot sync automation is broken."
              exit 1
            fi
            # Only a genuine lost race — someone pushed to the branch while
            # this job ran, so the remote head no longer matches the commit we
            # built on (HEAD^) — is downgraded to a warning; the next run
            # re-records and retries. The comparison uses the SHA the probe
            # above just returned (ls-remote output is "<sha>\t<ref>"; no
            # fetch runs in this handler, so FETCH_HEAD would be stale).
            # Any other failure (auth, branch protection, network) means the
            # sync automation itself is broken and must fail the job rather
            # than leave drift uncommitted under a green check.
            if [ "${remote_ref%%[[:space:]]*}" != "$(git rev-parse HEAD^)" ]; then
              echo "::warning::Screenshot refresh push lost a race with another push to ${GITHUB_HEAD_REF}; the next run will retry."
              exit 0
            fi
            echo "::error::Screenshot refresh push to ${GITHUB_HEAD_REF} failed for a non-race reason; the snapshot sync automation is broken."
            exit 1
          fi

      - name: Post screenshot diffs as a PR comment
        # Embeds every snapshot this PR adds or changes, pinned to commit
        # SHAs, into a single auto-updated PR comment (marker:
        # <!-- screenshot-diff -->) so reviewers see the visual delta inline
        # without downloading the artifact. Posted from CI's own token
        # because agent-side tooling can't post working image embeds. Runs
        # after "Commit refreshed screenshots" so HEAD includes the refreshed
        # PNGs; if that push lost its race (warning path above), the pinned
        # HEAD SHA may briefly 404 until the next run re-records. Same-repo
        # PRs only — the fork-PR token can't write comments.
        #
        # continue-on-error: this is a convenience comment, not a gate. A
        # transient GitHub API hiccup (a non-JSON response breaking the
        # `curl | jq` comment lookup has been seen here) must not turn the
        # whole screenshot job red — the snapshots are already committed and
        # in the roborazzi-screenshots artifact regardless.
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          HEAD_SHA=$(git rev-parse HEAD)
          mapfile -t entries < <(git diff --name-status "$BASE_SHA" HEAD -- app/src/test/snapshots/images/ | grep -E '^[AM]' || true)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No added or changed screenshots vs merge-base; skipping comment."
            exit 0
          fi
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}"
          body="<!-- screenshot-diff -->"$'\n'"## Screenshot diffs"$'\n\n'"Auto-posted by CI. Images pinned to \`${HEAD_SHA:0:7}\` (before images to the merge-base \`${BASE_SHA:0:7}\`)."$'\n'
          count=0
          for entry in "${entries[@]}"; do
            status="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            name=$(basename "$path")
            count=$((count+1))
            # GitHub caps comment bodies at 65536 chars; 20 embeds stays well
            # under it. The artifact still carries everything.
            if [ "$count" -gt 20 ]; then
              body+=$'\n'"_…truncated: more than 20 added/changed screenshots; see the roborazzi-screenshots artifact._"
              break
            fi
            if [ "$status" = "A" ]; then
              body+=$'\n'"**Added — \`${name}\`**"$'\n\n'"<img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\">"$'\n'
            else
              body+=$'\n'"**Changed — \`${name}\`**"$'\n\n'"| Before | After |"$'\n'"| --- | --- |"$'\n'"| <img src=\"${raw}/${BASE_SHA}/${path}\" width=\"320\"> | <img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\"> |"$'\n'
            fi
          done
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          existing=$(curl -sS \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${api}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r '[.[] | select(.body | startswith("<!-- screenshot-diff -->"))][0].id // empty')
          payload=$(jq -n --arg body "$body" '{body:$body}')
          if [ -n "$existing" ]; then
            curl -sS -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${api}/issues/comments/${existing}" \
              -d "$payload" > /dev/null
            echo "Updated screenshot-diff comment ${existing}."
          else
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${api}/issues/${PR_NUMBER}/comments" \
              -d "$payload" > /dev/null
            echo "Posted new screenshot-diff comment."
          fi

      - name: Upload Roborazzi screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: roborazzi-screenshots
          path: app/src/test/snapshots/images/

      - name: Upload screenshot test reports
        # JUnit XMLs and HTML reports for the screenshot suite — uploaded
        # even on failure so a CI-only crash leaves diagnostic output
        # behind. Pairs with the same step in the build job.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: screenshot-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    name: Distribute and release
    # Production deployment job. Gated three ways:
    #   1. `if:` — only runs on a push to main or a manual workflow_dispatch
    #      explicitly targeting main (the dispatch UI defaults the ref
    #      selector to main, but a maintainer could pick another branch,
    #      so this re-checks `github.ref` rather than trusting that
    #      default) — never on PRs.
    #   2. `environment: production` — secrets used here
    #      (FIREBASE_SERVICE_ACCOUNT_JSON, RELEASE_KEYSTORE_*,
    #      PLAY_SERVICE_ACCOUNT_JSON) live in the `production`
    #      environment with deployment protection rules. Configure the
    #      environment in repo Settings → Environments → production:
    #      restrict deployment branches to `main` and optionally
    #      require a reviewer. This makes the boundary enforced by
    #      GitHub, not just by the `if:` above (a malicious workflow
    #      edit on an internal branch can change `if:` but cannot
    #      bypass an environment protection rule).
    #   3. `needs:` — only runs after build and connected-tests
    #      both pass. A failing screenshot test on main now blocks the
    #      release; the previous setup would have shipped anyway.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, connected-tests]
    runs-on: ubuntu-latest
    environment: production
    env:
      # Secret *presence* flags — see the note on the `build` job's env.
      # A step's `if:` can't read that same step's `env:`, so the gates
      # below evaluate these job-level booleans instead of the secrets
      # directly; the secret values stay scoped to the steps that use them.
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_RELEASE_KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5

      - name: Materialize debug keystore
        # The Firebase distribution APK is a debug build (so testers
        # can side-load over previous installs), signed with the
        # shared debug keystore so successive Firebase releases install
        # as updates. Duplicated from the build job because deploy
        # runs on a separate runner.
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=${RUNNER_TEMP}/debug.keystore" >> "${GITHUB_ENV}"

      - name: Materialize google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Build debug APK for Firebase distribution
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: ./gradlew assembleDebug

      - name: Build release notes
        # Walks every commit in this push oldest-first and collects the
        # subject line of each one worth shipping as a release note — to
        # both Firebase App Distribution (testers' phones) and the Play
        # Store internal track (Play Console "What's new"):
        #   - skip commits whose subject starts with a non-user-facing
        #     prefix — `ci:` (CI plumbing, e.g. snapshot regenerations),
        #     `docs:` (documentation), `internal:` (build config, deps,
        #     and other plumbing with no user-visible effect), `refactor:`
        #     (behavior-preserving code changes), and `test:` / `tests:`
        #     (test-only changes). None describe a user-visible change
        #     worth announcing;
        #   - skip commits whose every changed path is repo housekeeping —
        #     a `.md` file (CLAUDE.md / SPEC.md / docs/*) or any dotfile /
        #     dotdir at the repo root (`.github/` workflows + templates +
        #     dependabot config, `.claude/` Claude Code workspace state,
        #     `.gitignore`, `.editorconfig`, etc.). `PRIVACY.md` is the
        #     explicit exception: it backs the hosted privacy policy
        #     linked from the About dialog, so a change there is
        #     genuinely user-facing and counts as a real commit.
        # The qualifying subjects are emitted as a "• "-bulleted list,
        # oldest-first — always bulleted, even when there's only one
        # qualifying commit, so the Play "What's new" card and Firebase
        # release notes render with a consistent shape. If no commit in
        # the push qualifies, sets RELEASE_NOTES_SKIP=true and both the
        # Firebase distribution and Play upload steps below skip — so a
        # push of only prefixed (ci: / docs: / internal: / refactor: /
        # test: / tests:) or docs / dotfile commits doesn't buzz
        # testers' phones or ship a redundant Play release.
        #
        # A manual workflow_dispatch is the one exception: it's an
        # explicit "publish the current tip anyway" request (see the
        # workflow_dispatch trigger's doc), so it never sets
        # RELEASE_NOTES_SKIP — falling back to a generic note instead of
        # skipping when nothing qualifies. It also has no
        # `github.event.before` to diff from, so the commit walk below
        # only ever considers the single HEAD commit for a dispatch run,
        # not the full range since the last release; that's fine for
        # "get the current tip out to testers" but means a dispatch run
        # won't surface older unreleased subjects buried deeper in
        # history.
        #
        # Engineering detail lives in the commit body, which neither
        # surface shows — see the "Commit messages" section in CLAUDE.md
        # for the wording convention. Play's documented per-language
        # cap is 500 Unicode characters for the entered "What's new"
        # text, so the truncation budget here is measured against the
        # full formatted output — bullet ("• "), newline separators,
        # and the "\n…" truncation marker all count toward MAX. If the
        # budget overflows we drop trailing subjects (oldest-first
        # preserved at the head) until it fits and append "\n…" so the
        # user knows the tail was cut. If a single subject alone
        # exceeds the cap (unlikely — subjects are conventionally ≤
        # ~70 chars) we hard-truncate the bullet line to 499 chars
        # and append "…".
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # On a first push to a branch (or after a force-reset that
          # orphans the old tip) BEFORE_SHA is all-zeros or otherwise
          # unreachable. There's no usable range to walk in that case, so
          # fall back to just HEAD — walking the entire history reachable
          # from HEAD would be both slow and meaningless.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --quiet --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            shas=$(git log -1 --format=%H "$AFTER_SHA")
          else
            shas=$(git log --reverse --no-merges --format=%H "$BEFORE_SHA..$AFTER_SHA")
          fi

          subjects=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            s=$(git log -1 --format=%s "$sha")
            case "$s" in
              ci:*)       continue ;;
              docs:*)     continue ;;
              internal:*) continue ;;
              refactor:*) continue ;;
              test:*)     continue ;;
              tests:*)    continue ;;
            esac
            relevant=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # `case` patterns match `*` against `/` too, so `.*` skips
              # any path whose first component starts with `.` — covers
              # `.github/`, `.claude/`, `.gitignore`, `.editorconfig` etc.
              # in one pattern.
              case "$f" in
                PRIVACY.md) relevant=true; break ;;
                .*)         ;;
                *.md)       ;;
                *)          relevant=true; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$sha")
            if [ "$relevant" = "false" ]; then
              continue
            fi
            subjects+=("$s")
          done <<< "$shas"

          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No release-worthy commits, but this is a manual workflow_dispatch — publishing the current tip anyway with a generic note."
              subjects+=("Internal test build")
            else
              echo "No release-worthy commits in this push (all ci: / docs: / internal: / refactor: / test: / tests: prefixed or docs / dotfile housekeeping); skipping Firebase distribution and Play upload."
              echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          MAX=500
          TRUNC_MARK=$'\n…'

          # `wc -m` counts characters under a UTF-8 locale; pin it so
          # the bullet ("• ", 1 visible char) and the ellipsis ("…", 1
          # char) are scored as Play sees them, not as raw bytes.
          export LC_ALL=C.UTF-8

          # Always emit a "• "-bulleted line per subject — even for a
          # single qualifying commit — so the Play "What's new" card
          # and Firebase release notes always render as a list.
          format_notes() {
            local first=1
            for s in "$@"; do
              if [ "$first" -eq 1 ]; then
                printf '%s' "• $s"
                first=0
              else
                printf '\n• %s' "$s"
              fi
            done
          }

          char_len() {
            printf '%s' "$1" | wc -m
          }

          # Truncate against the full formatted output — bullet ("• "),
          # newline separator, and the "\n…" truncation marker all
          # count toward MAX. Play's documented per-language cap is
          # 500 Unicode characters for the *entered* "What's new"
          # text, so measuring anything less risks writing
          # whatsnew-en-US over the cap and having the Play upload
          # reject the release.
          #
          # Two-phase: (1) greedy-add subjects until the formatted
          # output (no marker yet) would exceed MAX, then (2) if any
          # subject was dropped, append the "\n…" marker so the user
          # can tell the list was cut. The marker is load-bearing —
          # a truncated list must always end in it — so if the
          # marker pushes us back over MAX we drop trailing subjects
          # until there is room. In the rare edge case where the
          # very first subject is 499-500 chars formatted and cannot
          # coexist with the marker, hard-truncate it.
          kept=()
          truncated=false
          for s in "${subjects[@]}"; do
            candidate=$(format_notes "${kept[@]}" "$s")
            if [ "$(char_len "$candidate")" -gt "$MAX" ]; then
              truncated=true
              break
            fi
            kept+=("$s")
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            # First subject alone exceeds the cap; hard-truncate the
            # bullet line to 499 chars and append "…".
            notes=$(printf '%s' "• ${subjects[0]}" | cut -c 1-499)
            notes="${notes}…"
          else
            notes=$(format_notes "${kept[@]}")
            if [ "$truncated" = true ]; then
              # Drop trailing subjects until the marker fits.
              while [ "$(char_len "${notes}${TRUNC_MARK}")" -gt "$MAX" ] \
                && [ "${#kept[@]}" -gt 0 ]; do
                unset 'kept[${#kept[@]}-1]'
                notes=$(format_notes "${kept[@]}")
              done
              if [ "${#kept[@]}" -eq 0 ]; then
                # Subject 0 was 499-500 chars formatted on its own —
                # it fit in the greedy phase but couldn't coexist
                # with the marker. Hard-truncate the bullet line so
                # the marker still has room.
                notes=$(printf '%s' "• ${subjects[0]}" | cut -c 1-498)
              fi
              notes="${notes}${TRUNC_MARK}"
            fi
          fi

          # Use a random heredoc terminator so a crafted commit subject
          # can't include the literal terminator on a line of its own
          # and inject arbitrary entries into $GITHUB_ENV. `openssl` is
          # preinstalled on ubuntu-latest. See
          # https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          delim="RELEASE_NOTES_EOF_$(openssl rand -hex 16)"
          {
            printf 'RELEASE_NOTES<<%s\n' "$delim"
            printf '%s\n' "$notes"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

      - name: Distribute via Firebase App Distribution
        # Skipped when secrets aren't set so the build still finishes on a
        # fresh repo / fork. Also skipped when the preceding step set
        # RELEASE_NOTES_SKIP=true because every commit in this push was
        # either prefixed (`ci:` / `docs:` / `internal:` / `refactor:` /
        # `test:` / `tests:`) or pure docs / dotfile housekeeping
        # (`.github/`, `.claude/`, …) — see "Build release notes" — so we
        # don't buzz testers' phones for a notification whose preview
        # would read e.g. "ci: bump actions/checkout". Runs
        # before the Play Store upload so a Play failure (e.g. quota,
        # propagation) doesn't gate the faster Firebase channel testers
        # actually rely on. A manual workflow_dispatch never sets
        # RELEASE_NOTES_SKIP (see "Build release notes"), so this step
        # runs normally for a dispatch too — the point of dispatching is
        # to reach testers' phones on demand.
        if: |
          success() &&
          env.HAS_FIREBASE == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6  # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Tester group must exist in Firebase App Distribution console — see
          # docs/firebase-app-distribution.md. "testers" is the convention; rename
          # there + here together if you change it.
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          # Push notification on the tester's phone shows the first ~60 chars
          # of these notes — for a multi-commit push that's the oldest
          # qualifying commit's subject (the list is oldest-first; see
          # "Build release notes" upstream). The full bulleted list is
          # visible inside the Firebase tester app, and the same string
          # is what Play ships as "What's new", so the two surfaces stay
          # in sync.
          releaseNotes: |
            ${{ env.RELEASE_NOTES }}
            ---
            Build: ${{ github.run_number }} · ${{ github.sha }}

      - name: Materialize release keystore
        # Decoded whenever the keystore secret is present, independent of the
        # Play upload secrets. This lets the user populate the keystore secrets
        # first and download the resulting signed AAB from CI artifacts to do
        # the manual seed upload Play Console requires for new listings, then
        # add PLAY_SERVICE_ACCOUNT_JSON later to enable the automated upload.
        # See docs/play-store-internal-track.md.
        if: env.HAS_RELEASE_KEYSTORE_SECRET == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Build release AAB
        # Gated only on the keystore being present — a signed AAB is useful on
        # its own (downloadable artifact for the seed upload, even before the
        # Play service account is set up). Release signing config only attaches
        # when RELEASE_KEYSTORE_FILE is set (see app/build.gradle.kts), so
        # without the keystore Play would reject the AAB anyway.
        if: env.RELEASE_KEYSTORE_FILE != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Upload signed AAB as workflow artifact
        # Lets us download the signed AAB from the Actions UI for the one-time
        # manual seed upload to Play Console. Useful indefinitely afterwards
        # too if a release ever needs to be inspected or re-uploaded by hand.
        if: env.RELEASE_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Compose Play Store release notes
        # The upload-google-play action takes a directory of whatsnew-<locale>
        # files. The bulleted list of commit subjects was already built
        # upstream by "Build release notes" (and truncated to Play's
        # 500-byte per-locale cap); this step just writes it to disk in
        # the layout the action expects. When that earlier step set
        # RELEASE_NOTES_SKIP=true (every commit in the push was ci: /
        # docs / dotfile housekeeping) the gate below skips this and the
        # upload step.
        if: |
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/whatsnew"
          printf '%s' "${RELEASE_NOTES}" \
            > "${RUNNER_TEMP}/whatsnew/whatsnew-en-US"
          echo "PLAY_WHATSNEW_DIR=${RUNNER_TEMP}/whatsnew" >> "${GITHUB_ENV}"

      - name: Upload to Play Store internal track
        # Gated so it only runs with both the upload key and service account
        # configured. Also skipped when "Build release notes" set
        # RELEASE_NOTES_SKIP=true because every commit in this push was
        # either prefixed (`ci:` / `docs:` / `internal:` / `refactor:` /
        # `test:` / `tests:`) or pure docs / dotfile housekeeping
        # (`.github/`, `.claude/`, …) — no Play-worthy
        # "What's new" entry exists, so shipping a release would be
        # redundant. See docs/play-store-internal-track.md for the Play
        # Console / service-account setup the upload depends on.
        if: |
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.typelauncher
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ env.PLAY_WHATSNEW_DIR }}
