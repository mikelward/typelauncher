# Builds the catalog of Google Play categories (scripts/play-catalog/crawl.py),
# every six hours until the target is reached, or by hand. Each run crawls for up to --hours and saves its state to the
# Actions cache, so the next run resumes where it stopped; run it again until
# the log says the target is reached. Every run uploads the catalog so far as
# an artifact, to be committed in a pull request.
name: Google Play catalog

on:
  # Back to back at the crawl's usual pace until the catalog is complete
  # (maintainer, 2026-11-21: "keep going slowly until we got a full
  # dataset"). Each run crawls about 5 hours; once the target is reached, a
  # run ends at once. Runs this close keep the saved state well inside the
  # Actions cache's 7-day eviction.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Stop once this many apps are kept
        default: "60000"
      hours:
        description: Hours to crawl this run (at most 5.5)
        default: "5"

permissions:
  contents: read

concurrency:
  # Two runs would each resume from the same state and overwrite each other's.
  group: play-catalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Restore the crawl state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: play-catalog-state
          # Cache entries can't be overwritten, so each run saves its own and
          # the next restores the newest.
          key: play-catalog-state-${{ github.run_id }}
          restore-keys: play-catalog-state-

      - name: Crawl
        env:
          # A scheduled run has no inputs: the dispatch defaults.
          TARGET: ${{ inputs.target || '60000' }}
          HOURS: ${{ inputs.hours || '5' }}
          # Each country's Google Play, so apps sold in only one are found:
          # the English-speaking markets first, then the seeds' countries.
          COUNTRIES: >-
            US,GB,AU,CA,NZ,IE,IN,PK,NG,KE,GH,ZA,EG,MA,SA,AE,TR,HR,NL,DE,FR,ES,PT,IT,AT,CH,
            SE,NO,CZ,PL,RO,HU,GR,BG,RS,MX,BR,JP,KR,ID,TH,MY,PH
        run: >-
          python3 scripts/play-catalog/crawl.py --state play-catalog-state
          --target "$TARGET" --hours "$HOURS"
          --seeds scripts/play-catalog/seeds-known.txt
          --seeds scripts/play-catalog/seeds-countries.txt
          --known app/src/test/resources/play-catalog.tsv
          --countries "$COUNTRIES"

      - name: Save the crawl state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: play-catalog-state
          key: play-catalog-state-${{ github.run_id }}

      - name: Write the catalog
        if: always()
        run: python3 scripts/play-catalog/crawl.py --state play-catalog-state --write play_catalog.tsv

      - name: Upload the catalog
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: play-catalog
          path: play_catalog.tsv
