# Translated from this repo's former hand-synced shell lane-classification
# script (its is_housekeeping()/LANE_PREFIXES/dispatch_without_pr_ok(),
# since retired) -- the shared mikelward/lanes engine is the sole authority
# now.
#
# Markdown outside app/ cannot change what CI validates; anything under
# app/ is a build input whatever its extension (a packaged asset or
# resource can be markdown), so that stays on the code lane. PRIVACY.md is
# ordinary docs like the rest -- Play's "What's new" is a store-listing
# field a user installing an update never sees at update time, so forcing a
# wording-only change through the code lane never bought real visibility,
# only heavier CI. Order matters: app/** is checked before the general
# markdown rule, or a markdown file under app/ would ride the docs lane
# before app/** ever got a chance to say otherwise.
code app/**
docs **/*.md

# This repo's commit-subject conventions for housekeeping commits (see
# AGENTS.md "Commit messages"). Every commit riding the docs lane must carry one.
prefixes ci docs internal refactor test tests

# The retired shell script never checked the PR title, only commit
# subjects -- kept off here too, so the migration didn't silently add a
# new requirement an in-flight PR's title was never held to. Worth
# revisiting separately.
lint-title no

# The screenshot-refresh dispatch always names its PR; the maintainer's
# deploy-force dispatch on main never does. A PR-less dispatch is
# therefore allowed only on the default branch, verified live via the
# API -- never from anything a dispatched branch's own checkout could
# claim (see mikelward/lanes's own history with a policy-supplied
# branch name here, which turned out to be exactly that hole).
dispatch-without-pr allow-on-default-branch
