# Translated from scripts/docs-lane.sh's is_housekeeping()/LANE_PREFIXES/
# dispatch_without_pr_ok(), which this policy is replacing -- see the
# migration this file lands with for why both still exist for now.
#
# Markdown outside app/ cannot change what CI validates; anything under
# app/ is a build input whatever its extension (a packaged asset or
# resource can be markdown), and PRIVACY.md backs the hosted privacy
# policy linked from the About dialog and ships as a release-notes
# bullet, so both stay on the code lane. Order matters: PRIVACY.md and
# app/** are checked before the general markdown rule, or a markdown
# file under app/ would ride the docs lane before app/** ever got a
# chance to say otherwise.
code PRIVACY.md
code app/**
docs **/*.md

# This repo's commit-subject conventions for housekeeping commits (see
# AGENTS.md "Commit messages"). Every docs-lane commit must carry one.
prefixes ci docs internal refactor test tests

# docs-lane.sh never checked the PR title, only commit subjects -- kept
# off here too, so this migration doesn't silently add a new requirement
# an in-flight PR's title was never held to. Worth revisiting separately.
lint-title no

# The screenshot-refresh dispatch always names its PR; the maintainer's
# deploy-force dispatch on main never does. A PR-less dispatch is
# therefore allowed only on the default branch, verified live via the
# API -- never from anything a dispatched branch's own checkout could
# claim (see mikelward/lanes's own history with a policy-supplied
# branch name here, which turned out to be exactly that hole).
dispatch-without-pr allow-on-default-branch
